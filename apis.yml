aid: public-transport-victoria

name: Public Transport Victoria

description: Public Transport Victoria (PTV) is the Victorian Government public transport authority in Australia,
  covering metropolitan and regional train, tram and bus services. It publishes the PTV Timetable API (Version 3,
  documented in Swagger), which provides scheduled timetable, route and stop data for all Victorian train, tram
  and bus services including Night Network, real-time data for metropolitan services where available, disruption
  information, stop facility information and myki ticket outlet data. Access requires a developer ID and key; the
  dataset is listed on DataVic under the Department of Transport. ptv.vic.gov.au now redirects to transport.vic.gov.au.

